services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /sisdm
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3500:3500"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    command: sh -c "npm run prisma:migrate:deploy && npm run start"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3500/sisdm/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mariadb:
    image: mariadb:10.4.27
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
  uploads_data:
